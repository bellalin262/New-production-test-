<style>
  :root{
    color-scheme: light;
    --bg:#F4F6F4; --paper:#FFFFFF; --paper-alt:#EEF1EC;
    --ink:#1E2A26; --ink-dim:#6B7A72; --line:#DDE3DC;
    --navy:#233A4D; --gold:#B9812E; --gold-soft:#F3E3C6; --gold-line:rgba(185,129,46,0.4);
    --red:#B23A3A; --red-soft:#F7E4E2; --red-line:rgba(178,58,58,0.35);
    --teal:#3F8F72; --teal-soft:#DCEEE5; --teal-ink:#2C5C48; --teal-line:rgba(63,143,114,0.4);
    --chip-bg:#FFFFFF; --hero-ink:#FFFFFF;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#141B19; --paper:#1C2522; --paper-alt:#222D29;
      --ink:#E6ECE8; --ink-dim:#9AA8A1; --line:#2F3B37;
      --navy:#1A2B3A; --gold:#E0AE5C; --gold-soft:#3A2F1C; --gold-line:rgba(224,174,92,0.45);
      --red:#F08A80; --red-soft:#3A2321; --red-line:rgba(240,138,128,0.4);
      --teal:#6CC3A0; --teal-soft:#1D332B; --teal-ink:#9FDCC3; --teal-line:rgba(108,195,160,0.4);
      --chip-bg:#16201D;
    }
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
  ::selection{background:var(--gold-soft); color:var(--ink);}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .wrap{max-width:640px; margin:0 auto; padding:0 14px 70px;}

  header.hero{padding:28px 14px 20px; background:var(--navy); color:var(--hero-ink); position:relative; overflow:hidden;}
  header.hero::before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 90% -20%, rgba(185,129,46,0.35), transparent 55%), radial-gradient(circle at 0% 120%, rgba(63,143,114,0.28), transparent 50%); pointer-events:none;}
  .hero-inner{max-width:640px; margin:0 auto; position:relative;}
  .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em; color:#E8C27E; margin:0 0 8px;}
  h1.title{font-family:'Shippori Mincho', serif; font-weight:800; font-size:clamp(24px, 7vw, 32px); line-height:1.3; margin:0 0 6px; letter-spacing:0.02em;}
  .title small{display:block; font-size:0.44em; font-weight:500; color:rgba(255,255,255,0.7); margin-top:5px; letter-spacing:0.06em;}
  .hero-meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; font-size:11.5px; color:rgba(255,255,255,0.82);}
  .hero-meta span{display:flex; align-items:center; gap:5px; background:rgba(255,255,255,0.08); padding:4px 9px; border-radius:20px;}

  /* sync bar */
  .syncbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; padding:10px 12px; background:var(--paper); border:1px solid var(--line); border-radius:12px;}
  .sync-btn{display:inline-flex; align-items:center; gap:6px; border:none; background:var(--navy); color:#fff; font-size:13.5px; font-weight:700; padding:9px 14px; border-radius:10px; cursor:pointer;}
  .sync-btn:disabled{opacity:.6; cursor:progress;}
  .sync-btn svg{width:15px; height:15px;}
  .sync-btn.spinning svg{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .sync-btn.spinning svg{animation:none;} }
  .sync-status{flex:1 1 160px; font-size:12px; color:var(--ink-dim); line-height:1.45;}
  .sync-status.ok{color:var(--teal);}
  .sync-status.err{color:var(--red);}
  .sync-links{display:flex; gap:8px; width:100%; flex-wrap:wrap;}
  .ghost-btn{font-size:12px; color:var(--ink-dim); background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; text-decoration:none;}
  .ghost-btn[aria-pressed="true"]{color:var(--gold); border-color:var(--gold-line); background:var(--gold-soft);}

  .route-section{padding:14px 0 4px;}
  .route-label{font-size:11px; letter-spacing:0.1em; color:var(--ink-dim); margin:0 14px 10px;}
  .route-scroll{overflow-x:auto; padding:6px 14px 14px; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;}
  .route-scroll::-webkit-scrollbar{height:5px;}
  .route-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .route-line{position:relative; display:flex; align-items:flex-start; min-width:max-content; padding-top:4px;}
  .route-line::before{content:""; position:absolute; top:19px; left:20px; right:20px; height:3px; background:repeating-linear-gradient(90deg, var(--gold) 0 8px, transparent 8px 13px); z-index:0;}
  .station{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; width:74px; flex:0 0 auto; cursor:pointer; background:none; border:none; padding:0 0 8px; color:inherit; scroll-snap-align:center;}
  .station .dot{width:38px; height:38px; border-radius:50%; background:var(--paper); border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px; transition:all .15s ease; margin-bottom:6px; position:relative;}
  .station .flag{position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%; background:var(--red); border:2px solid var(--bg);}
  .station .date{font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; color:var(--ink-dim);}
  .station .dlabel{font-size:9.5px; color:var(--ink-dim); margin-top:1px; text-align:center; line-height:1.25; max-width:70px;}
  .station.active .dot{border-color:var(--gold); background:var(--gold-soft); box-shadow:0 0 0 4px rgba(185,129,46,0.14); transform:scale(1.05);}
  .station.active .date{color:var(--gold);}

  .day-panel{margin-top:8px; background:var(--paper); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .day-panel-head{padding:16px 16px 12px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--paper-alt);}
  .day-panel-head h2{font-family:'Shippori Mincho', serif; font-size:19px; margin:0;}
  .day-panel-head .theme{font-size:12px; color:var(--teal); font-weight:700;}
  .timeline{padding:4px 0;}

  .row,.transit-row,.tip-row{display:grid; grid-template-columns:58px 1fr; gap:0 12px; padding:13px 16px; border-bottom:1px solid var(--line); align-items:start;}
  .timeline > div:last-child{border-bottom:none;}
  .time{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13.5px; color:var(--gold); padding-top:2px; white-space:nowrap;}
  .activity{font-size:15px; font-weight:700; margin:0 0 4px;}
  .locrow{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:4px;}
  .maplink{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500; color:var(--ink); background:var(--gold-soft); border:1px solid var(--gold-line); padding:4px 10px 4px 8px; border-radius:20px; text-decoration:none; max-width:100%;}
  .maplink svg{width:12px; height:12px; flex:0 0 auto;}
  .locname-plain{font-size:13.5px; color:var(--ink-dim); white-space:pre-line;}
  .note{font-size:12.5px; color:var(--ink-dim); line-height:1.6; margin:2px 0 0; white-space:pre-line; overflow-wrap:anywhere;}

  .transit-row{padding:10px 16px; background:var(--teal-soft); border-bottom:1px dashed var(--teal-line);}
  .transit-row .time{color:var(--teal); font-size:12.5px;}
  .t-head{display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--teal-ink); margin-bottom:3px;}
  .transit-row .note{color:var(--teal-ink); opacity:.9;}

  .tip-row{padding:10px 16px; background:var(--paper);}
  .tip-row .time{font-size:12px; color:var(--ink-dim); font-weight:500;}
  .tip{border-left:3px solid var(--teal); padding:2px 0 2px 10px;}
  .tip.warn{border-left-color:var(--red);}
  .tip.idea{border-left-color:var(--gold);}
  .tip-kind{font-size:11px; font-weight:700; color:var(--teal); margin-bottom:2px;}
  .tip.warn .tip-kind{color:var(--red);}
  .tip.idea .tip-kind{color:var(--gold);}
  .tip-text{font-size:12.5px; line-height:1.6; color:var(--ink);}
  .tip-freq{font-size:12px; color:var(--teal-ink); font-weight:600; margin-top:3px;}
  .hide-tips .tip-row{display:none;}

  .station-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .chip{display:inline-flex; align-items:center; gap:4px; font-family:'JetBrains Mono', 'Noto Sans TC', monospace; font-size:11.5px; font-weight:600; color:var(--teal-ink); background:var(--chip-bg); border:1px solid var(--teal-line); padding:4px 9px; border-radius:16px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .chip:active{transform:scale(0.96);}
  .chip.copied{background:var(--teal); color:#fff; border-color:var(--teal);}
  .chip svg{width:10px; height:10px; flex:0 0 auto;}

  .empty-day{padding:36px 16px; text-align:center; color:var(--ink-dim); font-size:13.5px;}
  footer{text-align:center; padding:30px 14px 10px; font-size:11px; color:var(--ink-dim);}
</style>
</head>

function toHalf(s){
  return String(s||'').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/：/g, ':').trim();
}
function toMin(t){ const m = /^(\d{1,2}):(\d{2})/.exec(t||''); return m ? (+m[1])*60 + (+m[2]) : null; }

/* CSV 解析（支援引號內換行） */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = String(text).replace(/^\uFEFF/, '').replace(/^[\r\n]+/, '');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(cell); cell=''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row=[]; cell='';
    } else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

const URL_RE = /https?:\/\/[^\s"'，、）)]+/g;
const TRANSIT_RE = /(搭|轉乘|轉搭|電車|出門|步行|移動至|返程|返回住宿|發車|出發|線(?!上)|抵達.{0,6}(駅|站|機場|大阪(?!城)))/;
const FLIGHT_RE = /(落地|起飛|上飛機|抵達桃園)/;
const NO_MAP_RE = /(買|逛|報到|注意|：|安檢)/;

/* 把試算表轉成每天的行程 */
function sheetToItinerary(rows){
  const header = rows[0] || [];
  const days = [];
  header.forEach((h, i) => { const v = (h||'').trim(); if(/^\d{1,2}\/\d{1,2}/.test(v)) days.push({key:v, col:i}); });
  if(!days.length) throw new Error('找不到日期欄位（第一列應該是 10/21(三) 這種格式）');

  // 找資料起始列：跳過「行程,地點,備註」那列
  let start = 1;
  if(rows[1] && rows[1].some(c => /行程|地點|備註/.test(c||''))) start = 2;

  const out = {};
  days.forEach(d => out[d.key] = {rows:[], text:''});
  let lastTime = '';
  for(let r = start; r < rows.length; r++){
    const row = rows[r] || [];
    let t = toHalf(row[0]);
    let cont = false;
    if(!t){ t = lastTime; cont = true; } else lastTime = t;
    days.forEach(d => {
      const a = (row[d.col]||'').trim(), l = (row[d.col+1]||'').trim(), n = (row[d.col+2]||'').trim();
      if(!a && !l && !n) return;
      const urls = [...(l+'\n'+n).matchAll(URL_RE)].map(m => m[0]);
      const strip = s => s.replace(URL_RE, '').replace(/\n{2,}/g, '\n').trim();
      const loc = strip(l), note = strip(n);
      const both = (a || loc) ? (a + ' ' + loc) : note;
      let type = 'place';
      if(!urls.length){
        if(FLIGHT_RE.test(both)) type = 'flight';
        else if(TRANSIT_RE.test(both)) type = 'transit';
      }
      const item = {type, time: cont ? '' : t, sortMin: toMin(t) === null ? null : toMin(t) + (cont ? 0.5 : 0), activity:a, location:loc, note, urls};
      out[d.key].rows.push(item);
      out[d.key].text += ' ' + a + ' ' + l + ' ' + n;
    });
  }
  return {days: days.map(d => d.key), data: out};
}

/* ====== 狀態 ====== */
let TRIP = null, activeDay = null, showTips = lsGet(LS_TIPS) !== '0';

function dayShort(key){ return (key.match(/^\d{1,2}\/\d{1,2}/)||[''])[0]; }
function tipsFor(key){
  const list = TIPS[dayShort(key)] || [];
  const text = (TRIP.data[key] && TRIP.data[key].text) || '';
  const rows = (TRIP.data[key] && TRIP.data[key].rows) || [];
  return list.filter(t => {
    if(t.showIf && !new RegExp(t.showIf).test(text)) return false;
    if(t.hideIf && new RegExp(t.hideIf).test(text)) return false;
    if(t.hideAfter){
      const [pat, tm] = t.hideAfter, lim = toMin(tm);
      if(rows.some(r => new RegExp(pat).test(r.activity+' '+r.location+' '+r.note) && (r.sortMin ?? 0) >= lim)) return false;
    }
    return true;
  });
}

function mapsHref(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }

function renderRow(e){
  if(e.type === 'transit' || e.type === 'flight'){
    const icon = e.type === 'flight' ? '✈️' : '🚃';
    const head = [e.activity, e.location].filter(Boolean).join('　');
    const label = head || e.note || '交通移動';
    const note = head ? e.note : '';
    return `<div class="transit-row"><div class="time">${esc(e.time)}</div><div>
      <div class="t-head">${icon} ${esc(label)}</div>
      ${note ? `<p class="note">${esc(note)}</p>` : ''}
    </div></div>`;
  }
  const lines = (e.location||'').split('\n');
  const firstLine = lines[0].replace(/^抵達/, '').trim();
  const mapUrls = e.urls.filter(u => /maps|goo\.gl|reurl/.test(u));
  const webUrls = e.urls.filter(u => !mapUrls.includes(u));
  let links = '', usedFirst = false;
  mapUrls.forEach((u, i) => {
    const text = (i === 0 && firstLine) ? firstLine : '地圖';
    if(i === 0 && firstLine) usedFirst = true;
    links += `<a class="maplink" href="${esc(u)}" target="_blank" rel="noopener">${PIN_SVG}${esc(text)}</a>`;
  });
  if(!mapUrls.length && firstLine && firstLine.length <= 40 && !NO_MAP_RE.test(firstLine)){
    links += `<a class="maplink" href="${mapsHref(firstLine)}" target="_blank" rel="noopener">${PIN_SVG}${esc(firstLine)}</a>`;
    usedFirst = true;
  }
  webUrls.forEach(u => { links += `<a class="maplink" href="${esc(u)}" target="_blank" rel="noopener">${LINK_SVG}網站</a>`; });
  const extraLoc = usedFirst ? lines.slice(1).join('\n').trim() : (e.location||'');
  return `<div class="row"><div class="time">${esc(e.time)}</div><div>
    ${e.activity ? `<p class="activity">${esc(e.activity)}</p>` : ''}
    ${(links || extraLoc) ? `<div class="locrow">${links}${extraLoc ? `<span class="locname-plain">${esc(extraLoc)}</span>` : ''}</div>` : ''}
    ${e.note ? `<p class="note">${esc(e.note)}</p>` : ''}
  </div></div>`;
}

function renderTip(t){
  const kindText = {route:'🚃 交通建議', warn:'⚠️ 待確認', idea:'💡 建議'}[t.kind] || '💡 建議';
  const chips = (t.stations||[]).length ? `<div class="station-chips">${t.stations.map(s => `<button class="chip" type="button" data-station="${esc(s)}">${COPY_SVG}${esc(s)}</button>`).join('')}</div>` : '';
  return `<div class="tip-row"><div class="time">${esc(t.time)}</div>
    <div class="tip ${t.kind}"><div class="tip-kind">${kindText}</div>
      <div class="tip-text">${esc(t.text)}</div>
      ${t.freq ? `<div class="tip-freq">🕐 ${esc(t.freq)}</div>` : ''}${chips}
    </div></div>`;
}

function renderRoute(){
  const line = document.getElementById('routeLine');
  line.innerHTML = TRIP.days.map(d => {
    const meta = DAY_META[dayShort(d)] || {emoji:'📍', label:''};
    const wd = (d.match(/\(([^)]+)\)/)||['',''])[1];
    const hasWarn = tipsFor(d).some(t => t.kind === 'warn');
    return `<button class="station${d===activeDay?' active':''}" type="button" data-day="${esc(d)}" aria-label="${esc(d)} ${esc(meta.label)}">
      <div class="dot">${meta.emoji}${hasWarn && showTips ? '<span class="flag" title="有待確認事項"></span>' : ''}</div>
      <div class="date">${esc(dayShort(d))}</div>
      <div class="dlabel">${esc(wd)}${meta.label ? '・'+esc(meta.label) : ''}</div>
    </button>`;
  }).join('');
  line.querySelectorAll('.station').forEach(b => b.addEventListener('click', () => {
    activeDay = b.dataset.day; lsSet('tripActiveDay', activeDay);
    renderRoute(); renderDay();
    document.getElementById('dayPanel').scrollIntoView({behavior:'smooth', block:'start'});
  }));
  const a = line.querySelector('.station.active'); if(a && a.scrollIntoView) try{ a.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){}
}

function renderDay(){
  const panel = document.getElementById('dayPanel');
  const meta = DAY_META[dayShort(activeDay)] || {emoji:'📍', label:''};
  const rows = (TRIP.data[activeDay] || {rows:[]}).rows;
  const tips = tipsFor(activeDay);
  // 合併：依時間排序，同時間「試算表內容」在前、建議在後
  const items = [];
  rows.forEach((r,i) => items.push({k:0, m:r.sortMin ?? 0, i, html:renderRow(r)}));
  tips.forEach((t,i) => items.push({k:1, m:toMin(t.time) ?? 0, i, html:renderTip(t)}));
  items.sort((a,b) => a.m - b.m || a.k - b.k || a.i - b.i);
  panel.innerHTML = `<div class="day-panel-head"><h2>${meta.emoji} ${esc(activeDay)}</h2><span class="theme">${esc(meta.label)}</span></div>
    <div class="timeline${showTips ? '' : ' hide-tips'}">${items.length ? items.map(x => x.html).join('') : '<div class="empty-day">這天還沒有排行程，可以在試算表填好後按「同步試算表」</div>'}</div>`;
  panel.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => copyStation(b)));
}

function copyStation(btn){
  const text = btn.dataset.station, orig = btn.innerHTML;
  const done = () => { btn.innerHTML = CHECK_SVG + '已複製'; btn.classList.add('copied'); setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1200); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); done(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback); else fallback();
}

function load(csvText){
  TRIP = sheetToItinerary(parseCSV(csvText));
  if(!activeDay || !TRIP.days.includes(activeDay)){
    const saved = lsGet('tripActiveDay');
    activeDay = TRIP.days.includes(saved) ? saved : TRIP.days[0];
  }
  renderRoute(); renderDay();
}

function setStatus(msg, cls){ const s = document.getElementById('syncStatus'); s.textContent = msg; s.className = 'sync-status' + (cls ? ' '+cls : ''); }
function fmt(d){ const p = n => String(n).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

/* ====== 同步 ====== */
async function syncSheet(){
  const btn = document.getElementById('syncBtn');
  btn.disabled = true; btn.classList.add('spinning'); setStatus('正在讀取試算表…');
  const bust = '&_=' + Date.now();
  const sources = [
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}${bust}`,
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&gid=${SHEET_GID}${bust}`
  ];
  let lastErr = null;
  for(const url of sources){
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if(/^\s*</.test(text)) throw new Error('試算表沒有公開分享');
      const parsed = sheetToItinerary(parseCSV(text)); // 先驗證格式
      const count = parsed.days.reduce((n,d) => n + parsed.data[d].rows.length, 0);
      lsSet(LS_CSV, text); const now = new Date(); lsSet(LS_AT, now.toISOString());
      load(text);
      setStatus(`已同步 ${fmt(now)}・${parsed.days.length} 天 ${count} 筆`, 'ok');
      btn.disabled = false; btn.classList.remove('spinning');
      return;
    } catch(e){ lastErr = e; }
  }
  setStatus(`同步失敗：${lastErr ? lastErr.message : '未知錯誤'}。請確認有網路，且試算表「知道連結的人可以檢視」。目前顯示的是上次的資料。`, 'err');
  btn.disabled = false; btn.classList.remove('spinning');
}

/* ====== 啟動 ====== */
document.getElementById('sheetLink').href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${SHEET_GID}`;
document.getElementById('syncBtn').addEventListener('click', syncSheet);
const tipsBtn = document.getElementById('tipsBtn');
function paintTipsBtn(){ tipsBtn.setAttribute('aria-pressed', showTips ? 'true' : 'false'); tipsBtn.textContent = showTips ? '💡 隱藏交通建議與待確認' : '💡 顯示交通建議與待確認'; }
tipsBtn.addEventListener('click', () => { showTips = !showTips; lsSet(LS_TIPS, showTips ? '1' : '0'); paintTipsBtn(); renderRoute(); renderDay(); });
paintTipsBtn();

(function init(){
  const cached = lsGet(LS_CSV), at = lsGet(LS_AT);
  try{
    if(cached){ load(cached); setStatus(`上次同步 ${at ? fmt(new Date(at)) : ''}，試算表有改就按左邊按鈕`); return; }
  } catch(e){ /* 快取壞掉就用內建資料 */ }
  load(document.getElementById('snapshot').textContent);
  setStatus(`目前是內建資料（${SNAPSHOT_DATE} 版），按左邊按鈕抓最新試算表`);
})();

</script>
