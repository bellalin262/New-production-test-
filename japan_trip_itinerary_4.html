<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>名古屋・大阪・京都 10日行程表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F4;
    --paper:#FFFFFF;
    --paper-alt:#EEF1EC;
    --ink:#1E2A26;
    --ink-dim:#6B7A72;
    --line:#DDE3DC;
    --navy:#233A4D;
    --gold:#B9812E;
    --gold-soft:#F3E3C6;
    --red:#B23A3A;
    --red-soft:#F5DEDE;
    --teal:#3F8F72;
    --teal-soft:#DCEEE5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold-soft); color:var(--ink);}

  .wrap{max-width:640px; margin:0 auto; padding:0 14px 70px;}

  /* ---------- Header ---------- */
  header.hero{
    padding:28px 14px 20px;
    background:var(--navy);
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 90% -20%, rgba(185,129,46,0.35), transparent 55%),
      radial-gradient(circle at 0% 120%, rgba(63,143,114,0.28), transparent 50%);
    pointer-events:none;
  }
  .hero-inner{max-width:640px; margin:0 auto; position:relative;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    color:#E8C27E;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  h1.title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(24px, 7vw, 32px);
    line-height:1.3;
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  .title small{
    display:block;
    font-size:0.44em;
    font-weight:500;
    color:rgba(255,255,255,0.7);
    margin-top:5px;
    letter-spacing:0.06em;
  }
  .hero-meta{
    display:flex; gap:10px; flex-wrap:wrap;
    margin-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:rgba(255,255,255,0.82);
  }
  .hero-meta span{
    display:flex; align-items:center; gap:5px;
    background:rgba(255,255,255,0.08);
    padding:4px 9px;
    border-radius:20px;
  }

  /* ---------- Route line ---------- */
  .route-section{padding:18px 0 4px;}
  .route-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-dim); margin:0 14px 10px;
  }
  .route-scroll{
    overflow-x:auto;
    padding:6px 14px 14px;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
  }
  .route-scroll::-webkit-scrollbar{height:5px;}
  .route-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .route-line{
    position:relative;
    display:flex;
    align-items:flex-start;
    min-width:max-content;
    padding-top:4px;
  }
  .route-line::before{
    content:"";
    position:absolute;
    top:19px; left:20px; right:20px;
    height:3px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 8px, transparent 8px 13px);
    z-index:0;
  }
  .station{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:74px;
    flex:0 0 auto;
    cursor:pointer;
    background:none;
    border:none;
    padding:0 0 8px;
    font-family:inherit;
    color:inherit;
    scroll-snap-align:center;
  }
  .station .dot{
    width:38px; height:38px;
    border-radius:50%;
    background:#fff;
    border:2.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    transition:all .15s ease;
    margin-bottom:6px;
    box-shadow:0 1px 3px rgba(30,42,38,0.08);
  }
  .station .date{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:700;
    color:var(--ink-dim);
    transition:color .15s ease;
  }
  .station .dlabel{
    font-size:9.5px;
    color:var(--ink-dim);
    margin-top:1px;
    text-align:center;
    line-height:1.25;
    opacity:0.85;
    max-width:70px;
  }
  .station.active .dot{
    border-color:var(--gold);
    background:var(--gold-soft);
    box-shadow:0 0 0 4px rgba(185,129,46,0.14);
    transform:scale(1.05);
  }
  .station.active .date{color:var(--gold);}

  /* ---------- Day panel ---------- */
  .day-panel{
    margin-top:8px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .day-panel-head{
    padding:16px 16px 12px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    background:var(--paper-alt);
  }
  .day-panel-head h2{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    margin:0;
    display:flex; align-items:center; gap:8px;
  }
  .day-panel-head .theme{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--teal);
    letter-spacing:0.04em;
  }

  .timeline{padding:4px 0;}

  /* place row */
  .row{
    display:grid;
    grid-template-columns:58px 1fr;
    gap:0 12px;
    padding:13px 16px;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  .row:last-child{border-bottom:none;}
  .row .time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13.5px;
    color:var(--gold);
    padding-top:2px;
    white-space:nowrap;
  }
  .row .content .activity{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 3px;
  }
  .row .content .locrow{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:4px;
  }
  .maplink{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    font-weight:500;
    color:var(--navy);
    background:var(--gold-soft);
    border:1px solid rgba(185,129,46,0.4);
    padding:4px 10px 4px 8px;
    border-radius:20px;
    text-decoration:none;
    transition:background .15s ease;
  }
  .maplink:active{background:#e9d3a6;}
  .maplink svg{width:12px; height:12px; flex:0 0 auto;}
  .locname-plain{font-size:13.5px; color:var(--ink-dim);}
  .row .content .note{
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.5;
    margin-top:2px;
  }

  /* transit row */
  .transit-row{
    display:grid;
    grid-template-columns:58px 1fr;
    gap:0 12px;
    padding:10px 16px;
    background:var(--teal-soft);
    border-bottom:1px dashed rgba(63,143,114,0.35);
    align-items:start;
  }
  .transit-row .time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12.5px;
    color:var(--teal);
    padding-top:2px;
    white-space:nowrap;
  }
  .transit-row .t-head{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:700;
    color:#2C5C48;
    margin-bottom:3px;
  }
  .transit-row .t-freq{
    font-size:12px;
    color:#3F6F5C;
    line-height:1.5;
    margin-bottom:6px;
  }
  .t-freq.freq-line{
    color:#2C5C48;
    font-weight:600;
  }
  .station-chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:2px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    color:#2C5C48;
    background:#fff;
    border:1px solid rgba(63,143,114,0.4);
    padding:4px 9px;
    border-radius:16px;
    cursor:pointer;
    transition:background .12s ease, transform .08s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:active{transform:scale(0.96);}
  .chip.copied{background:var(--teal); color:#fff; border-color:var(--teal);}
  .chip svg{width:10px; height:10px; flex:0 0 auto;}

  .empty-day{
    padding:36px 16px;
    text-align:center;
    color:var(--ink-dim);
    font-size:13.5px;
  }

  footer{
    text-align:center;
    padding:30px 14px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-dim);
    opacity:0.7;
  }
</style>
</head>

</script>
<script>
const PIN_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22s7-7.58 7-13A7 7 0 0 0 5 9c0 5.42 7 13 7 13Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>`;
const COPY_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.8"/></svg>`;
const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function copyStation(btn){
  const text = btn.getAttribute('data-station');
  const origHtml = btn.innerHTML;
  const doFeedback = () => {
    btn.innerHTML = `${CHECK_SVG}已複製`;
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = origHtml;
      btn.classList.remove('copied');
    }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(doFeedback).catch(() => fallbackCopy(text, doFeedback));
  } else {
    fallbackCopy(text, doFeedback);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  cb();
}

const days = Object.keys(TRIP_DATA.itinerary);
let activeDay = days[0];

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderRoute(){
  const line = document.getElementById('routeLine');
  line.innerHTML = days.map(d => {
    const meta = TRIP_DATA.dayMeta[d] || {emoji:'📍', label:''};
    const dateStr = d.match(/^([\d/]+)/)[1];
    const weekday = d.match(/\(([^)]+)\)/)[1];
    return `<button class="station${d===activeDay ? ' active':''}" data-day="${d}">
      <div class="dot">${meta.emoji}</div>
      <div class="date">${dateStr}</div>
      <div class="dlabel">${weekday}・${meta.label}</div>
    </button>`;
  }).join('');

  line.querySelectorAll('.station').forEach(btn => {
    btn.addEventListener('click', () => {
      activeDay = btn.getAttribute('data-day');
      renderRoute();
      renderDay();
      document.getElementById('dayPanel').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  const activeEl = line.querySelector('.station.active');
  if(activeEl) activeEl.scrollIntoView({inline:'center', block:'nearest'});
}

function renderDay(){
  const panel = document.getElementById('dayPanel');
  const meta = TRIP_DATA.dayMeta[activeDay] || {emoji:'📍', label:''};
  const entries = TRIP_DATA.itinerary[activeDay] || [];

  let rowsHtml = '';
  if(entries.length === 0){
    rowsHtml = `<div class="empty-day">這天還沒有排定行程</div>`;
  } else {
    rowsHtml = entries.map(e => {
      if(e.type === 'transit'){
        const hasContent = e.activity || e.location || e.note || e.route_text;
        if(!hasContent) return '';
        const label = [e.activity, e.location].filter(Boolean).join(' ');
        const stations = e.stations || [];
        const chipsHtml = stations.length ? `<div class="station-chips">${stations.map(s => `<button class="chip" data-station="${escapeHtml(s)}" onclick="copyStation(this)">${COPY_SVG}${escapeHtml(s)}</button>`).join('')}</div>` : '';
        return `<div class="transit-row">
          <div class="time">${e.time}</div>
          <div>
            ${label ? `<div class="t-head">🚃 ${escapeHtml(label)}</div>` : `<div class="t-head">🚃 交通移動</div>`}
            ${e.route_text ? `<div class="t-freq">${escapeHtml(e.route_text)}</div>` : ''}
            ${e.freq ? `<div class="t-freq freq-line">🕐 ${escapeHtml(e.freq)}</div>` : ''}
            ${e.note ? `<div class="t-freq">${escapeHtml(e.note)}</div>` : ''}
            ${chipsHtml}
          </div>
        </div>`;
      } else {
        const hasActivity = e.activity && e.activity.trim().length>0;
        const hasLocation = e.location && e.location.trim().length>0;
        let locHtml = '';
        if(hasLocation){
          if(e.maps_url){
            locHtml = `<a class="maplink" href="${e.maps_url}" target="_blank" rel="noopener">${PIN_SVG}${escapeHtml(e.location)}</a>`;
          } else {
            locHtml = `<span class="locname-plain">${escapeHtml(e.location)}</span>`;
          }
        }
        return `<div class="row">
          <div class="time">${e.time}</div>
          <div class="content">
            ${hasActivity ? `<p class="activity">${escapeHtml(e.activity)}</p>` : ''}
            ${hasLocation ? `<div class="locrow">${locHtml}</div>` : ''}
            ${e.note ? `<p class="note">${escapeHtml(e.note)}</p>` : ''}
          </div>
        </div>`;
      }
    }).join('');
  }

  panel.innerHTML = `
    <div class="day-panel-head">
      <h2>${meta.emoji} ${activeDay}</h2>
      <span class="theme">${meta.label}</span>
    </div>
    <div class="timeline">${rowsHtml}</div>
  `;
}

renderRoute();
renderDay();
</script>
